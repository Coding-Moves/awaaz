name: Voice issue
description: Report a pronunciation or voice problem.
labels: ["voices"]
body:
  - type: textarea
    id: text
    attributes:
      label: Text
    validations:
      required: true
  - type: input
    id: voice
    attributes:
      label: Voice used
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What did it say wrong?
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What should it say?
    validations:
      required: true
