name: Bug report
description: Tell us what went wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: ["Natural voice", "Browser voice"]
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type, if any
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
